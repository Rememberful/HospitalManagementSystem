# ── Server ──────────────────────────────────────────────────────────────
server.port=8080

# ── Datasource (file-based H2 so data survives restarts; zero external setup) ──
spring.datasource.url=jdbc:h2:file:./data/hms;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Swap in MySQL for production by uncommenting below and removing the H2 block:
# spring.datasource.url=jdbc:mysql://localhost:3306/hms?createDatabaseIfNotExist=true
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=your_password

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# The H2 web console is a raw database UI, so it is OFF by default. It is also incompatible with
# this app's security config (the console registers its own servlet, which makes Spring Security
# refuse to start until URL matchers are rewritten to be servlet-aware). If you need it for local
# debugging, connect with any external H2 client to the file at ./data/hms instead.
spring.h2.console.enabled=false

# ── CORS (React dev server) ────────────────────────────────────────────
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# ── Jackson ─────────────────────────────────────────────────────────────
spring.jackson.default-property-inclusion=non_null

# ── JWT auth ─────────────────────────────────────────────────────────────
# DEV-ONLY DEFAULT. In any real deployment this MUST be overridden — e.g. by
# exporting JWT_SECRET as an environment variable — and never committed to
# source control. Generate a fresh one with:
#   python3 -c "import secrets,base64; print(base64.b64encode(secrets.token_bytes(48)).decode())"
app.jwt.secret=${JWT_SECRET:sF8QJ0H9TP7fmptDPcQNy8YvZTXrxf6fNcRRdo06rDFEnqfUFstR28ytixfG/PVs}
app.jwt.expiration-ms=86400000

# ── Sign-in throttling ────────────────────────────────────────────────────
# After this many consecutive failed sign-ins for a username, that username is locked out.
app.security.max-login-attempts=5
app.security.lockout-minutes=15
